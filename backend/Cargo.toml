[package]
name = "nas-file-manager"
version = "0.9.0"
edition = "2021"
autotests = false

[dependencies]
axum = "0.8"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
notify = { version = "8.2.0", default-features = false }
rars = { version = "=0.9.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "=0.23.0", default-features = false, features = ["aes256"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
url = "2"
zip = { version = "=8.6.0", default-features = false, features = ["aes-crypto", "deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
