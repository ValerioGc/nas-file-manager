[package]
name = "fs-explorer-axum"
version = "0.1.26"
edition = "2021"

[dependencies]
axum = "0.8"
chrono = "0.4"
fs-core = { path = "../core" }
notify = { version = "8.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
url = "2"

[dev-dependencies]
# The same crate fs-core already uses, for images made by the tests: nothing new in Cargo.lock.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
tower = { version = "0.5", features = ["util"] }
